[project]
name = "graph-fans"
version = "0.1.0"
description = "Graph-FANS: Frequency-Adaptive Noise Shaping on Graph Laplacian Spectra"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "networkx>=3.1",
    "torch>=2.0",
    "torch-geometric>=2.4",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ipykernel>=6.0",
    "jupyter>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
